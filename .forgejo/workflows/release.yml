name: Build and Release Python Tarball (Forgejo)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to build (e.g. 3.10.20). Required for manual runs."
        required: true
        type: string

env:
  IMAGE_REF: registry:5000/py-c6-builder

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Python version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PYTHON_VERSION="${{ inputs.python_version }}"
          else
            # Tag is the source of truth on push events: vX.Y.Z -> X.Y.Z
            PYTHON_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "${PYTHON_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Resolved PYTHON_VERSION '${PYTHON_VERSION}' is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          PYTHON_MINOR="${PYTHON_VERSION%.*}"
          TARBALL="python${PYTHON_VERSION}-c6-relocatable.tar.gz"
          echo "python_version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"
          echo "python_minor=${PYTHON_MINOR}" >> "$GITHUB_OUTPUT"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Inspect runner CPU (x86-64 microarch level)
        shell: bash
        run: |
          set -u
          echo "--- uname ---"
          uname -a
          echo
          echo "--- ld.so reported microarch levels ---"
          for ld in /lib64/ld-linux-x86-64.so.2 /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2; do
            [ -x "$ld" ] || continue
            echo "loader: $ld"
            "$ld" --help 2>&1 | sed -n '/Subdirectories of glibc-hwcaps/,/^$/p' || true
            break
          done
          echo
          echo "--- /proc/cpuinfo flag check (v2 requires all yes) ---"
          flags=$(grep -m1 '^flags' /proc/cpuinfo | sed 's/^flags\s*:\s*//')
          for f in cx16 lahf_lm popcnt pni ssse3 sse4_1 sse4_2; do
            case " $flags " in *" $f "*) echo "  $f: yes";; *) echo "  $f: NO";; esac
          done
          echo
          echo "--- model / hypervisor ---"
          grep -m1 'model name' /proc/cpuinfo || true
          grep -m1 -E 'hypervisor' /proc/cpuinfo >/dev/null && echo "  running under a hypervisor" || echo "  bare metal (no hypervisor flag)"
          command -v lscpu >/dev/null && lscpu | grep -E 'Model name|Hypervisor|Virtualization' || true

      - name: Inspect workspace contents (runner-side)
        shell: bash
        run: |
          set -eu
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<unset>}"
          echo "PWD=$(pwd)"
          echo
          echo "--- ls -la \$GITHUB_WORKSPACE ---"
          ls -la "${GITHUB_WORKSPACE:-/github/workspace}"

      - name: Inspect workspace contents (docker:// side)
        # Same execution context kaniko sees. Confirms which paths are
        # actually accessible from within a docker:// step before we
        # commit to a kaniko --context value.
        uses: docker://busybox:latest
        with:
          args: >-
            sh -c "
            echo 'PWD inside docker step:'; pwd;
            echo;
            echo 'ls /github/workspace (GitHub-style mount path):';
            ls -la /github/workspace 2>&1 || echo MISSING;
            echo;
            echo 'ls ${{ github.workspace }} (workflow-expression value):';
            ls -la ${{ github.workspace }} 2>&1 || echo MISSING;
            "

      - name: Build image with kaniko
        uses: docker://gcr.io/kaniko-project/executor:debug
        with:
          args: >-
            --context=dir://${{ github.workspace }}
            --dockerfile=Dockerfile
            --destination=${{ env.IMAGE_REF }}:${{ github.sha }}
            --build-arg=PYTHON_VERSION=${{ steps.ver.outputs.python_version }}
            --build-arg=PYTHON_MINOR=${{ steps.ver.outputs.python_minor }}
            --insecure
            --skip-tls-verify
            --single-snapshot
            --use-new-run

      - name: Export flattened image with crane
        uses: docker://gcr.io/go-containerregistry/crane:debug
        with:
          args: --insecure export ${{ env.IMAGE_REF }}:${{ github.sha }} ${{ github.workspace }}/image.tar

      - name: Extract python tarball from image
        shell: bash
        env:
          TARBALL: ${{ steps.ver.outputs.tarball }}
        run: |
          set -euo pipefail
          tar -xf image.tar "opt/${TARBALL}"
          mv "opt/${TARBALL}" .
          rm -rf opt image.tar
          ls -lh "${TARBALL}"

      - name: Create release and upload asset
        if: github.event_name == 'push'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PYTHON_VERSION: ${{ steps.ver.outputs.python_version }}
          PYTHON_MINOR: ${{ steps.ver.outputs.python_minor }}
          TARBALL: ${{ steps.ver.outputs.tarball }}
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq curl jq
          BODY=$(jq -n \
            --arg tag "$TAG" \
            --arg name "Release $TAG" \
            --arg version "$PYTHON_VERSION" \
            --arg minor "$PYTHON_MINOR" \
            '{tag_name:$tag, name:$name, draft:false, prerelease:false,
              body:"Relocatable Python \($version) for CentOS 6 (glibc 2.12). Includes OpenSSL 1.1.1, SQLite 3.45, full stdlib, pip. Extract anywhere; binaries use $ORIGIN-relative rpath. Use as /opt/python\($minor)/bin/python\($minor)."}')
          RELEASE_ID=$(curl -fsSL -X POST "$API/releases" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" | jq -r '.id')
          curl -fsSL -X POST "$API/releases/$RELEASE_ID/assets?name=$TARBALL" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -F "attachment=@${TARBALL}"
