name: Build and Release Python Tarball

permissions:
  contents: write
  packages: write
  actions: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to build (e.g. 3.10.20). Required for manual runs."
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Python version
        id: ver
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PYTHON_VERSION="${{ inputs.python_version }}"
          else
            # Tag is the source of truth on push events: vX.Y.Z -> X.Y.Z
            PYTHON_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "${PYTHON_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Resolved PYTHON_VERSION '${PYTHON_VERSION}' is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          PYTHON_MINOR="${PYTHON_VERSION%.*}"
          TARBALL="python${PYTHON_VERSION}-c6-relocatable.tar.gz"
          echo "python_version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"
          echo "python_minor=${PYTHON_MINOR}" >> "$GITHUB_OUTPUT"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Build Python tarball
        run: mise run build "${{ steps.ver.outputs.python_version }}"

      - name: Verify tarball exists
        run: |
          ls -lh "${{ steps.ver.outputs.tarball }}"
          echo "Tarball size: $(du -h "${{ steps.ver.outputs.tarball }}" | cut -f1)"

      - name: Create Release
        id: create_release
        if: github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Relocatable Python ${{ steps.ver.outputs.python_version }} for CentOS 6

            This release contains a relocatable Python ${{ steps.ver.outputs.python_version }} build compatible with CentOS 6 (glibc 2.12).

            ### Installation

            1. Download `${{ steps.ver.outputs.tarball }}`
            2. Extract to your desired location: `tar -xzf ${{ steps.ver.outputs.tarball }} -C /opt/`
            3. Use Python: `/opt/python${{ steps.ver.outputs.python_minor }}/bin/python${{ steps.ver.outputs.python_minor }} --version`

            ### Features

            - CentOS 6 compatible (glibc 2.12)
            - Relocatable (extract anywhere)
            - Includes OpenSSL 1.1.1, full standard library, and pip

      - name: Upload Release Asset
        if: github.event_name == 'push'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.ver.outputs.tarball }}
          asset_name: ${{ steps.ver.outputs.tarball }}
          asset_content_type: application/gzip

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.tarball }}
          path: ./${{ steps.ver.outputs.tarball }}
